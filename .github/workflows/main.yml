name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buscar el proyecto
        run: |
          echo "Archivos del repositorio:"
          find . -maxdepth 3 -not -path './.git*' | sort
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No encontré settings.gradle. Revisa que se hayan subido todos los archivos."
            exit 1
          fi
          echo "PROJ=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" InicioTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InicioTV-apk
          path: InicioTV.apk
