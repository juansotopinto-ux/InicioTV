name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ordenar carpetas (si los archivos se subieron sueltos)
        run: |
          set -e
          if [ ! -d app ] && ls *.java >/dev/null 2>&1; then
            echo "Archivos sueltos detectados: ordenando carpetas..."
            mkdir -p app/src/main/java/cl/jc/inicio app/src/main/res/drawable app/src/main/res/values gradle/wrapper
            mv *.java app/src/main/java/cl/jc/inicio/
            mv AndroidManifest.xml app/src/main/
            mv banner.xml bg.xml ic_*.xml app/src/main/res/drawable/
            mv colors.xml strings.xml styles.xml app/src/main/res/values/
            for f in *.gradle; do
              [ "$f" = "settings.gradle" ] && continue
              if grep -q "namespace" "$f"; then APP="$f"; else ROOT="$f"; fi
            done
            mv "$APP" app.gradle.tmp
            mv "$ROOT" build.gradle
            mv app.gradle.tmp app/build.gradle
            [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle-wrapper.properties gradle/wrapper/ || true
          fi
          find . -not -path './.git*' -type f | sort

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk InicioTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InicioTV-apk
          path: InicioTV.apk
